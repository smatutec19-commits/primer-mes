<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Galaxia 3D - Primer Mes</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; }

        #main-title{
            position: fixed; top: 40px; left: 0; right: 0; width: 100%;
            font-size: 2.6em; color: #E6E6FA; white-space: nowrap;
            text-shadow: 0 0 10px #DA70D6, 0 0 18px #8A2BE2;
            z-index: 10; pointer-events: none; text-align: center;
            font-family: 'Segoe UI', cursive, sans-serif;
        }
        @media (max-width:768px){
            #main-title{ font-size: 1.55em; top: 22px; white-space: normal; padding: 0 10px; line-height: 1.15; }
        }

        #start-screen{
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            flex-direction: column; color: #fff; z-index: 9999; padding: 20px; cursor: pointer;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #start-heart{
            font-size: clamp(74px, 23vmin, 148px); line-height: 1; display: block;
            filter: drop-shadow(0 0 14px rgba(186,85,211,.75)) drop-shadow(0 0 36px rgba(138,43,226,.38));
            animation: latido 1.35s ease-in-out infinite; transform-origin: 50% 55%;
        }
        @keyframes latido{
            0%, 100% { transform: scale(1); }
            12% { transform: scale(1.15); }
            24% { transform: scale(1); }
            36% { transform: scale(1.07); }
            50% { transform: scale(1); }
        }
        #start-text{
            font-size: 1.8em; color: #E6E6FA; font-family: 'Segoe UI', cursive, sans-serif;
            text-shadow: 0 0 7px #DA70D6; text-align: center;
            margin-top: clamp(16px, 3.5vh, 28px);
            animation: parpadeo 2.2s ease-in-out infinite;
        }
        @keyframes parpadeo { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <h1 id="main-title">Feliz Primer Mes 💜</h1>

    <div id="start-screen" onclick="startExperience()">
        <div id="start-heart">💜</div>
        <div id="start-text">Toca para iniciar</div>
    </div>

    <!-- Librería Three.js estable por CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(innerWidth, innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
        let targetDist = 300, currentDist = 300, rotX = 0.2, rotY = 0;

        // Estrellas de fondo
        (function makeStars(count = 2000, spread = 3000) {
            const g = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = spread * (0.3 + Math.random() * 0.7);
                const th = Math.random() * Math.PI * 2;
                const ph = Math.acos(2 * Math.random() - 1);
                pos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
                pos[i * 3 + 1] = r * Math.cos(ph);
                pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
            }
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.5, color: 0xe6e6fa, depthWrite: false })));
        })();

        // Núcleo central (Planeta / Agujero Negro)
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x483d8b, roughness: 0.85, metalness: 0.05 });
        const core = new THREE.Mesh(new THREE.SphereGeometry(40, 64, 64), coreMat);
        scene.add(core);

        scene.add(new THREE.AmbientLight(0xd8bfd8, 0.55));
        const keyLight = new THREE.DirectionalLight(0xe6e6fa, 1.15);
        keyLight.position.set(220, 160, 280);
        scene.add(keyLight);

        // Anillo estilo Saturno
        function ringTexture(size = 1024) {
            const c = document.createElement('canvas'); c.width = c.height = size;
            const g = c.getContext('2d'); g.translate(size / 2, size / 2);
            const rInner = size * 0.205, rOuter = size * 0.49;
            const grd = g.createRadialGradient(0, 0, rInner, 0, 0, rOuter);
            grd.addColorStop(0.00, 'rgba(240,230,140,1)');
            grd.addColorStop(0.30, 'rgba(218,112,214,1)');
            grd.addColorStop(0.65, 'rgba(138,43,226,0.95)');
            grd.addColorStop(1.00, 'rgba(75,0,130,0.85)');
            g.fillStyle = grd;
            g.beginPath(); g.arc(0, 0, rOuter, 0, Math.PI * 2); g.arc(0, 0, rInner, 0, Math.PI * 2, true); g.closePath(); g.fill();
            return new THREE.CanvasTexture(c);
        }
        const ring = new THREE.Mesh(new THREE.RingGeometry(42, 116, 160), new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // Frases flotantes
        const frases = ["💜 Un mes entero a tu lado", "🟣 Gracias por este hermoso primer mes", "💜 Cada día contigo es especial", "🟣 Mi lugar favorito es a tu lado", "💜 Feliz primer mes, mi amor", "🟣 Te adoro con todo el corazón"];
        const textGroup = new THREE.Group(); scene.add(textGroup);

        frases.forEach((texto, i) => {
            const c = document.createElement('canvas'); c.width = 512; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#da70d6'; ctx.shadowBlur = 20;
            ctx.font = "40px sans-serif";
            ctx.fillText(texto, c.width / 2, c.height / 2);
            const tex = new THREE.CanvasTexture(c);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sp = new THREE.Sprite(mat);
            sp.scale.set(70, 22, 1);
            const phi = Math.acos(2 * Math.random() - 1); const theta = Math.random() * Math.PI * 2;
            const r = 160 + Math.random() * 100;
            sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            textGroup.add(sp);
        });

        // Controles de rotación con mouse / táctil
        let dragging = false, lastX = 0, lastY = 0;
        addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
        addEventListener('mousemove', e => {
            if (!dragging) return;
            rotY -= (e.clientX - lastX) / innerWidth * 5;
            rotX = Math.max(-1.2, Math.min(1.2, rotX + (e.clientY - lastY) / innerHeight * 3.5));
            lastX = e.clientX; lastY = e.clientY;
        });
        addEventListener('mouseup', () => { dragging = false; });
        addEventListener('touchstart', e => { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive: true});
        addEventListener('touchmove', e => {
            if (!dragging) return;
            rotY -= (e.touches[0].clientX - lastX) / innerWidth * 5;
            rotX = Math.max(-1.2, Math.min(1.2, rotX + (e.touches[0].clientY - lastY) / innerHeight * 3.5));
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }, {passive: true});
        addEventListener('touchend', () => { dragging = false; }, {passive: true});
        addEventListener('wheel', e => {
            targetDist += e.deltaY * 0.25;
            targetDist = Math.max(160, Math.min(600, targetDist));
        }, {passive: true});

        // Bucle de animación
        let t = 0;
        function tick() {
            requestAnimationFrame(tick);
            t += 0.01;
            ring.rotation.z += 0.003;
            const s = 1.0 + 0.05 * Math.sin(t * 3);
            core.scale.set(s, s, s);

            currentDist += (targetDist - currentDist) * 0.06;
            const cx = Math.cos(rotX), sx = Math.sin(rotX);
            const cy = Math.cos(rotY), sy = Math.sin(rotY);
            camera.position.set(currentDist * sy * cx, currentDist * sx, currentDist * cy * cx);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        tick();

        // Función de inicio blindada para quitar la pantalla del corazón al instante
        function startExperience() {
            const startScreen = document.getElementById('start-screen');
            startScreen.classList.add('hidden');
            setTimeout(() => { startScreen.style.display = 'none'; }, 700);
        }
    </script>
</body>
</html>
