<!DOCTYPE html>
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Galaxia Simple - Primer Mes de Novios</title>
<meta name="description" content="Una galaxia sencilla con agujero negro, anillo morado y fotos flotando entre frases de nuestro primer mes juntos.">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;text y=&#39;.9em&#39; font-size=&#39;90&#39;&gt;💜&lt;/text&gt;&lt;/svg&gt;">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./css/fonts.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  #main-title{
    position:fixed;top:40px;left:0;right:0;width:100%;
    font-size:2.6em;color:#E6E6FA;white-space:nowrap;
    text-shadow:0 0 10px #DA70D6,0 0 18px #8A2BE2;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{font-size:1.55em;top:22px;white-space:normal;padding:0 10px;line-height:1.15;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(186,85,211,.75)) drop-shadow(0 0 36px rgba(138,43,226,.38)) drop-shadow(0 0 66px rgba(75,0,130,.22));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }
  #start-text{
    font-size:1.8em;color:#E6E6FA;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #DA70D6;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
</style>
</head>
<body>
<canvas id="c" data-engine="three.js r148"></canvas>

<h1 id="main-title">Feliz Primer Mes 💜</h1>

<div id="start-screen">
  <div id="start-heart" aria-hidden="true">💜</div>
  <div id="start-text">Toca para iniciar y escuchar la música</div>
</div>

<!-- Canción romántica configurada para reproducirse al tocar -->
<audio id="audio" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-guitars-112134.mp3" type="audio/mpeg">
</audio>

<script src="./js/three.min.js"></script>

<script>
const DEFAULTS = {
  titulo: "Feliz Primer Mes 💜",
  frases: [
    "💜 Un mes entero a tu lado", "🟣 Gracias por este hermoso primer mes", "💜 Cada día contigo es especial",
    "🟣 Mi lugar favorito es a tu lado", "💜 Un mes desde que empezó esta magia", "🟣 Contigo todo es mejor",
    "💜 Tu sonrisa ilumina mis días", "🟣 Gracias por aparecer en mi vida", "💜 Te quiero muchísimo",
    "🟣 Brillas más que las estrellas", "💜 Este es solo el comienzo de muchos meses más", "🟣 Eres lo mejor que me ha pasado",
    "💜 Contigo el tiempo vuela", "🟣 Amo cada momento juntos", "💜 Feliz primer mes, mi amor",
    "🟣 Tu risa es mi sonido favorito", "💜 Gracias por este mes lleno de amor", "🟣 Eres mi paz y mi alegría",
    "💜 Quédate conmigo siempre", "🟣 Te adoro con todo el corazón", "💜 Nuestro primer mes juntos"
  ],
  fotos: ["assets/img1.png","assets/img2.png","assets/img3.png"]
};

const audio = document.getElementById('audio');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300, currentDist=300, rotX=0.2, rotY=0;

// Estrellas de fondo
(function makeStars(count=2000, spread=3000){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0; i<count; i++){
    const r = spread*(0.3+Math.random()*0.7);
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3+0] = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:1.5, color:0xe6e6fa, depthWrite:false})));
})();

function planetTexture(size=512){
  const c = document.createElement('canvas'); c.width = size; c.height = size/2;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,c.height);
  [['#2e1a47',0.00],['#483d8b',0.08],['#6a5acd',0.16],['#7b68ee',0.24],
   ['#9370db',0.33],['#ba55d3',0.42],['#9370db',0.50],['#7b68ee',0.58],
   ['#6a5acd',0.67],['#483d8b',0.75],['#8a2be2',0.83],['#9370db',0.90],
   ['#2e1a47',1.00]].forEach(([col,stop])=>grad.addColorStop(stop,col));
  g.fillStyle = grad; g.fillRect(0,0,c.width,c.height);
  return new THREE.CanvasTexture(c);
}

const coreMat = new THREE.MeshStandardMaterial({map: planetTexture(), roughness:0.85, metalness:0.05});
const core = new THREE.Mesh(new THREE.SphereGeometry(40,64,64), coreMat);
scene.add(core);

scene.add(new THREE.AmbientLight(0xd8bfd8, 0.55));
const keyLight = new THREE.DirectionalLight(0xe6e6fa, 1.15);
keyLight.position.set(220,160,280);
scene.add(keyLight);

// Brillo central morado
const GLOW_BASE = 360;
function makeGlow(size=768, c1='186,85,211', c2='75,0,130'){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({map: makeGlow(), transparent:true, depthWrite:false}));
glow.scale.set(GLOW_BASE, GLOW_BASE, 1);
scene.add(glow);

// Anillo morado
function ringTexture(size=1024){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.translate(size/2,size/2);
  const rInner=size*0.205, rOuter=size*0.49;

  const grd = g.createRadialGradient(0,0,rInner,0,0,rOuter);
  grd.addColorStop(0.00,'rgba(230,230,250,1)');
  grd.addColorStop(0.30,'rgba(218,112,214,1)');
  grd.addColorStop(0.65,'rgba(138,43,226,0.95)');
  grd.addColorStop(1.00,'rgba(75,0,130,0.85)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0,0,rOuter,0,Math.PI*2); g.arc(0,0,rInner,0,Math.PI*2,true); g.closePath(); g.fill();
  return new THREE.CanvasTexture(c);
}
const ring = new THREE.Mesh(new THREE.RingGeometry(42,116,160), new THREE.MeshBasicMaterial({map: ringTexture(), transparent:true, side:THREE.DoubleSide, blending:THREE.AdditiveBlending}));
ring.rotation.x = Math.PI/2;
scene.add(ring);

// Frases flotantes del primer mes
const WORDS = Array.from({length: 150}, (_,i)=> DEFAULTS.frases[i%DEFAULTS.frases.length]);
function makeTextTexture(text, color){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.font = "45px 'Indie Flower', cursive";
  ctx.fillText(text, c.width/2, c.height/2);
  return new THREE.CanvasTexture(c);
}

const COLORS = ['#da70d6','#ba55d3','#9370db','#8a2be2','#dda0dd','#ee82ee','#9400d3'];
const textGroup = new THREE.Group(); scene.add(textGroup);

WORDS.forEach((word, i)=>{
  const tex = makeTextTexture(word, COLORS[i%COLORS.length]);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent:true}));
  sp.scale.set(68, 21.8, 1);
  const phi = Math.acos(2*Math.random()-1), theta = Math.random()*Math.PI*2;
  const r = 150 + Math.random()*120;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  sp.userData = {phi, theta, radius: r, speed: 0.001 + Math.random()*0.001};
  textGroup.add(sp);
});

// Interacción táctil y de mouse
let dragging=false, lastX=0, lastY=0;
addEventListener('mousedown', e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
addEventListener('mousemove', e=>{
  if(!dragging) return;
  rotY -= (e.clientX - lastX)/innerWidth * 5;
  rotX = Math.max(-1.2, Math.min(1.2, rotX + (e.clientY - lastY)/innerHeight * 3.5));
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('mouseup', ()=> dragging=false);
addEventListener('wheel', e=>{
  targetDist = Math.max(160, Math.min(600, targetDist + e.deltaY*0.25));
},{passive:true});

// Bucle de animación
let t=0;
function tick(){
  requestAnimationFrame(tick);
  t += 0.01;
  ring.rotation.z += 0.003;
  core.scale.setScalar(1.0 + 0.05*Math.sin(t*3));
  
  textGroup.children.forEach(sp=>{
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });

  currentDist += (targetDist - currentDist) * 0.06;
  camera.position.set(currentDist*Math.sin(rotY)*Math.cos(rotX), currentDist*Math.sin(rotX), currentDist*Math.cos(rotY)*Math.cos(rotX));
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}
tick();

// Iniciar experiencia y reproducir música al hacer clic
const startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  setTimeout(()=> startScreen.style.display='none', 800);
  audio.play().catch(err => console.log("Audio play error:", err));
});
</script>
</body>
</html>
